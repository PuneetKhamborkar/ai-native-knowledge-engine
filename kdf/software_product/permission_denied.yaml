version: 5.1
type: troubleshooting

id: permission_denied

intent:
  name: permission_denied

  aliases:
    - permission denied
    - access denied
    - not authorized

vocabulary:
  entity: [user]
  action: [access]
  failure: [denied]

semantic:
  entities: [user]
  actions: [access]
  failure_terms: [denied, restricted]
  context_terms: [role, auth]

signals:
  base: [access, denied]

  modifiers: [restricted]

  weighted:
    high: [access denied]
    medium: [permission denied]
    low: [issue]

failure:
  problem: Access denied

  causes:

    - id: role_restriction
      version: 1.1
      label: Role restriction
      description: User role lacks permission

      signal_map:
        strong: [role_restricted]
        weak: [denied]

      confidence:
        base: 0.6
        boost_if_strong_match: 0.3
        decay_if_weak: 0.2

      evidence:
        types: [auth_log]
        required: false

resolution:
  role_restriction:
    steps:
      - Contact admin
      - Request access
    automation_possible: false

diagnostics:
  ambiguity_possible: false
  clarification_questions: []
  decision_tree: []

context:
  domain: security
  feature: authorization
  platforms: [web]
  user_roles: [user]

relationships:
  depends_on: [auth_api]
  upstream_failures: []
  downstream_effects: [blocked_action]
  related_intents: [login_issue]

constraints:
  - do_not_infer_new_causes
  - only_use_defined_signal_map
  - enforce_string_signals_only
  - no_cross_intent_resolution

# =========================
# 🔒 KDF HARDENING LAYER (v5.1)
# =========================

signal_rules:
  min_base_tokens: 2
  forbid_generic:
    - issue
    - problem
    - error
    - fail
    - not working
    - broken

intent_gate:
  required_base_match: true
  min_match_count: 1

validation:
  enforce_string_signals: true
  reject_numeric_signals: true
  sanitize_inputs: true

confidence_policy:
  min_confidence: 0.5
  fallback_on_low_confidence: true
  require_strong_signal_for_resolution: true

routing_guard:
  prevent_cross_intent_bleed: true
  require_intent_match_before_cause_scoring: true

normalization:
  lowercase: true
  strip_special_chars: true
  multilingual_input: true
  translate_to_english_before_matching: true

safety:
  no_freeform_generation: true
  only_kdf_grounded_response: true
  block_unknown_causes: true