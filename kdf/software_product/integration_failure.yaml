version: 5.1
type: troubleshooting

id: integration_failure

intent:
  name: integration_failure

  aliases:
    - integration failed
    - webhook not working
    - third party issue
    - integration error

vocabulary:
  entity: [integration]
  action: [connect]
  failure: [fail]

semantic:
  entities: [integration, webhook]
  actions: [connect]
  failure_terms: [fail, error]
  context_terms: [api, external]

signals:
  base: [integration, fail]

  modifiers: [webhook, external]

  weighted:
    high: [integration failed]
    medium: [webhook not working]
    low: [issue]

failure:
  problem: Integration failure

  causes:

    - id: external_service_down
      version: 1.1
      label: External service unavailable
      description: Third-party system down

      signal_map:
        strong: [service_down]
        weak: [external]

      confidence:
        base: 0.6
        boost_if_strong_match: 0.3
        decay_if_weak: 0.2

      evidence:
        types: [api_response]
        required: false

resolution:
  external_service_down:
    steps:
      - Check third-party status
      - Retry later
    automation_possible: false

diagnostics:
  ambiguity_possible: false
  clarification_questions: []
  decision_tree: []

context:
  domain: integrations
  feature: external_services
  platforms: [web]
  user_roles: [admin]

relationships:
  depends_on: []
  upstream_failures: []
  downstream_effects: [feature_failure]
  related_intents: [api_failure]

constraints:
  - do_not_infer_new_causes
  - only_use_defined_signal_map
  - enforce_string_signals_only
  - no_cross_intent_resolution

# =========================
# 🔒 KDF HARDENING LAYER (v5.1)
# =========================

signal_rules:
  min_base_tokens: 2
  forbid_generic:
    - issue
    - problem
    - error
    - fail
    - not working
    - broken

intent_gate:
  required_base_match: true
  min_match_count: 1

validation:
  enforce_string_signals: true
  reject_numeric_signals: true
  sanitize_inputs: true

confidence_policy:
  min_confidence: 0.5
  fallback_on_low_confidence: true
  require_strong_signal_for_resolution: true

routing_guard:
  prevent_cross_intent_bleed: true
  require_intent_match_before_cause_scoring: true

normalization:
  lowercase: true
  strip_special_chars: true
  multilingual_input: true
  translate_to_english_before_matching: true

safety:
  no_freeform_generation: true
  only_kdf_grounded_response: true
  block_unknown_causes: true