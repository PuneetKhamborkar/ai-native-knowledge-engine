version: 5.1
type: troubleshooting

id: data_not_loading

intent:
  name: data_not_loading

  aliases:
    - data not loading
    - content not loading
    - page empty
    - no data visible

vocabulary:
  entity: [data]
  action: [load, fetch]
  failure: [empty, missing]

semantic:
  entities: [data, content]
  actions: [load, fetch]
  failure_terms: [not loading, empty]
  context_terms: [api, ui]

signals:
  base: [data, load]

  modifiers: [empty, missing]

  weighted:
    high: [data not loading]
    medium: [page empty]
    low: [issue]

failure:
  problem: Data not loading in UI

  causes:

    - id: api_no_response
      version: 1.1
      label: API not returning data
      description: Backend not sending data
      triggers: [api_failure]
      indicators: [empty_response]
      impact: empty UI

      signal_map:
        strong: [no_data_response]
        weak: [empty]

      confidence:
        base: 0.6
        boost_if_strong_match: 0.3
        decay_if_weak: 0.2

      evidence:
        types: [api_response]
        required: false

resolution:
  api_no_response:
    steps:
      - Check API response
      - Retry fetch
    automation_possible: false

diagnostics:
  ambiguity_possible: true
  clarification_questions:
    - Is API returning data?
  decision_tree:
    - condition: api_no_response
      ask: Is API response empty?

context:
  domain: frontend
  feature: data_display
  platforms: [web]
  user_roles: [user]

relationships:
  depends_on: [api_failure]
  upstream_failures: [api_failure]
  downstream_effects: [blank_ui]
  related_intents: [api_failure]

constraints:
  - do_not_infer_new_causes
  - only_use_defined_signal_map
  - enforce_string_signals_only
  - no_cross_intent_resolution

# =========================
# 🔒 KDF HARDENING LAYER (v5.1)
# =========================

signal_rules:
  min_base_tokens: 2
  forbid_generic:
    - issue
    - problem
    - error
    - fail
    - not working
    - broken

intent_gate:
  required_base_match: true
  min_match_count: 1

validation:
  enforce_string_signals: true
  reject_numeric_signals: true
  sanitize_inputs: true

confidence_policy:
  min_confidence: 0.5
  fallback_on_low_confidence: true
  require_strong_signal_for_resolution: true

routing_guard:
  prevent_cross_intent_bleed: true
  require_intent_match_before_cause_scoring: true

normalization:
  lowercase: true
  strip_special_chars: true
  multilingual_input: true
  translate_to_english_before_matching: true

safety:
  no_freeform_generation: true
  only_kdf_grounded_response: true
  block_unknown_causes: true