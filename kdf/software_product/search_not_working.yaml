version: 5.1
type: troubleshooting

id: search_not_working

intent:
  name: search_not_working

  aliases:
    - search not working
    - cannot find results
    - search empty
    - no search results

vocabulary:
  entity: [search]
  action: [query]
  failure: [empty]

semantic:
  entities: [search]
  actions: [query, find]
  failure_terms: [empty, no results]
  context_terms: [filter, index]

signals:
  base: [search, results]

  modifiers: [empty, none]

  weighted:
    high: [search not working]
    medium: [no results found]
    low: [issue]

failure:
  problem: Search not returning results

  causes:

    - id: indexing_issue
      version: 1.1
      label: Search index missing
      description: Data not indexed

      signal_map:
        strong: [index_missing]
        weak: [empty]

      confidence:
        base: 0.6
        boost_if_strong_match: 0.3
        decay_if_weak: 0.2

      evidence:
        types: [search_log]
        required: false

resolution:
  indexing_issue:
    steps:
      - Rebuild search index
      - Verify indexing service
    automation_possible: false

diagnostics:
  ambiguity_possible: false
  clarification_questions: []
  decision_tree: []

context:
  domain: search
  feature: query_engine
  platforms: [web]
  user_roles: [user]

relationships:
  depends_on: []
  upstream_failures: []
  downstream_effects: [data_not_found]
  related_intents: [data_not_loading]

constraints:
  - do_not_infer_new_causes
  - only_use_defined_signal_map
  - enforce_string_signals_only
  - no_cross_intent_resolution

# =========================
# 🔒 KDF HARDENING LAYER (v5.1)
# =========================

signal_rules:
  min_base_tokens: 2
  forbid_generic:
    - issue
    - problem
    - error
    - fail
    - not working
    - broken

intent_gate:
  required_base_match: true
  min_match_count: 1

validation:
  enforce_string_signals: true
  reject_numeric_signals: true
  sanitize_inputs: true

confidence_policy:
  min_confidence: 0.5
  fallback_on_low_confidence: true
  require_strong_signal_for_resolution: true

routing_guard:
  prevent_cross_intent_bleed: true
  require_intent_match_before_cause_scoring: true

normalization:
  lowercase: true
  strip_special_chars: true
  multilingual_input: true
  translate_to_english_before_matching: true

safety:
  no_freeform_generation: true
  only_kdf_grounded_response: true
  block_unknown_causes: true