version: 5.1
type: troubleshooting

id: cache_issue

intent:
  name: cache_issue

  aliases:
    - cache issue
    - stale data
    - old data showing
    - data not updating

  examples:
    - I see old data
    - changes not reflecting

vocabulary:
  entity: [cache]
  action: [update]
  failure: [stale]

semantic:
  entities: [cache, data]
  actions: [refresh, update]
  failure_terms: [stale, outdated]
  context_terms: [browser, memory]

signals:
  base: [cache, stale]

  modifiers: [outdated, old]

  weighted:
    high: [stale data]
    medium: [old data showing]
    low: [issue]

failure:
  problem: Stale data due to cache

  causes:

    - id: browser_cache
      version: 1.1
      label: Browser cache issue
      description: Cached data not refreshed

      signal_map:
        strong: [cache_not_cleared]
        weak: [old]

      confidence:
        base: 0.6
        boost_if_strong_match: 0.3
        decay_if_weak: 0.2

      evidence:
        types: [ui_state]
        required: false

resolution:
  browser_cache:
    steps:
      - Clear browser cache
      - Hard refresh page
    automation_possible: false

diagnostics:
  ambiguity_possible: false
  clarification_questions: []
  decision_tree: []

context:
  domain: frontend
  feature: caching
  platforms: [web]
  user_roles: [user]

relationships:
  depends_on: []
  upstream_failures: []
  downstream_effects: [stale_ui]
  related_intents: [data_not_loading]

constraints:
  - do_not_infer_new_causes
  - only_use_defined_signal_map
  - enforce_string_signals_only
  - no_cross_intent_resolution

# =========================
# 🔒 KDF HARDENING LAYER (v5.1)
# =========================

signal_rules:
  min_base_tokens: 2
  forbid_generic:
    - issue
    - problem
    - error
    - fail
    - not working
    - broken

intent_gate:
  required_base_match: true
  min_match_count: 1

validation:
  enforce_string_signals: true
  reject_numeric_signals: true
  sanitize_inputs: true

confidence_policy:
  min_confidence: 0.5
  fallback_on_low_confidence: true
  require_strong_signal_for_resolution: true

routing_guard:
  prevent_cross_intent_bleed: true
  require_intent_match_before_cause_scoring: true

normalization:
  lowercase: true
  strip_special_chars: true
  multilingual_input: true
  translate_to_english_before_matching: true

safety:
  no_freeform_generation: true
  only_kdf_grounded_response: true
  block_unknown_causes: true