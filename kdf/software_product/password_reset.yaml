version: 5.1
type: troubleshooting

id: password_reset

intent:
  name: password_reset

  aliases:
    - password reset not working
    - reset link failed
    - cannot reset password

  examples:
    - reset link not working
    - cannot reset password

vocabulary:
  entity: [password]
  action: [reset]
  failure: [fail, expired]

semantic:
  entities: [password]
  actions: [reset]
  failure_terms: [expired, invalid]
  context_terms: [email, link]

signals:
  base:
    - password
    - reset

  modifiers:
    - expired
    - invalid

  weighted:
    high:
      - reset link expired
    medium:
      - reset failed
    low:
      - issue

failure:
  problem: Password reset not working

  causes:

    - id: expired_link
      version: 1.1

      label: Reset link expired

      description: Link validity expired

      triggers:
        - time delay

      indicators:
        - expired message

      impact:
        - reset blocked

      signal_map:
        strong: [link_expired]
        weak: [expired]

      confidence:
        base: 0.6
        boost_if_strong_match: 0.3
        decay_if_weak: 0.2

      evidence:
        types: [ui_message]
        required: false

    - id: email_issue
      version: 1.1

      label: Reset email not received

      description: Email delivery failed

      triggers:
        - spam filtering

      indicators:
        - no email

      impact:
        - cannot access reset link

      signal_map:
        strong: [email_not_received]
        weak: [email]

      confidence:
        base: 0.5
        boost_if_strong_match: 0.3
        decay_if_weak: 0.2

      evidence:
        types: [email_log]
        required: false

resolution:

  expired_link:
    steps:
      - Request new reset link
      - Use immediately
    automation_possible: false

  email_issue:
    steps:
      - Check spam folder
      - Request email again
    automation_possible: false

diagnostics:

  ambiguity_possible: true

  clarification_questions:
    - Did you receive email?
    - Is link expired?

  decision_tree:

    - condition: expired_link
      ask: Is the link expired?

    - condition: email_issue
      ask: Did you receive the email?

context:
  domain: authentication
  feature: password_reset
  platforms: [web, mobile]
  user_roles: [admin, user]

relationships:

  depends_on: [email_service]

  upstream_failures: [login_issue]

  downstream_effects: [login_blocked]

  related_intents: [login_issue]

constraints:

  - do_not_infer_new_causes
  - only_use_defined_signal_map
  - enforce_string_signals_only
  - no_cross_intent_resolution

# =========================
# 🔒 KDF HARDENING LAYER (v5.1)
# =========================

signal_rules:
  min_base_tokens: 2
  forbid_generic:
    - issue
    - problem
    - error
    - fail
    - not working
    - broken

intent_gate:
  required_base_match: true
  min_match_count: 1

validation:
  enforce_string_signals: true
  reject_numeric_signals: true
  sanitize_inputs: true

confidence_policy:
  min_confidence: 0.5
  fallback_on_low_confidence: true
  require_strong_signal_for_resolution: true

routing_guard:
  prevent_cross_intent_bleed: true
  require_intent_match_before_cause_scoring: true

normalization:
  lowercase: true
  strip_special_chars: true
  multilingual_input: true
  translate_to_english_before_matching: true

safety:
  no_freeform_generation: true
  only_kdf_grounded_response: true
  block_unknown_causes: true